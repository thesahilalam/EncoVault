<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EncoVault — a local file security toolkit for learning and applying encryption and compression, entirely in your browser.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f6fa">
  <title>EncoVault · File Security Toolkit</title>
  <link rel="stylesheet" href="styles.css?v=2.0.26.0.25.0.24.0.23.0.22.0.21.0.20.0.19.0.18.0.17.0.16.0.15.0.14.0.13.0.12.0.11.0.10.0.9.0.8.0.7.0.6.0.5.0.4.0.3.0.2.0.1.0.0.1.0.0.2.0.1">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" id="home-link"><span class="brand-mark">E</span><span><strong>EncoVault</strong><small>FILE SECURITY TOOLKIT</small></span></a>
      <div class="side-label">YOUR FILES</div>
      <nav class="primary-nav" aria-label="File tools">
        <button class="nav-button active" data-mode="lock"><span class="nav-icon">🔐</span>Encryption</button>
        <button class="nav-button" data-mode="compress"><span class="nav-icon">⌁</span>Compression</button>
      </nav>
      <div class="side-label lab-label">SANDBOXES</div>
      <nav class="lab-nav" aria-label="Try the tools">
        <button class="nav-button" data-lab="classical"><span class="nav-icon">⌘</span>Classical ciphers</button>
        <button class="nav-button" data-lab="modern"><span class="nav-icon">◈</span>Modern cryptography</button>
        <button class="nav-button" data-lab="compression"><span class="nav-icon">↔</span>Security lab</button>
      </nav>
      <div class="side-label learn-label">REFERENCE</div>
      <nav class="learn-nav" aria-label="Security reference">
        <button class="nav-button" data-learn><span class="nav-icon">i</span>Security reference</button>
      </nav>
      <div class="sidebar-bottom">
        <span class="live-dot"></span><span>Files stay on this device</span>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <span>Theme</span>
          <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><span>EncoVault</span><span class="slash">/</span><strong id="crumb">Encryption</strong></div><span class="local-pill"><span class="live-dot"></span> LOCAL MODE</span></header>
      <section class="content" id="content"></section>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
