<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#4f46e5">

  <div class="app-shell">
